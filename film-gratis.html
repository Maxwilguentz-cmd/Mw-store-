<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWStore - Films Gratuits</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #0c0b09;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .menu-icons {
            position: relative;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .dropdown-connexion {
            display: none;
            position: absolute;
            top: 40px;
            right: 0;
            background: #0c0b09;
            border: 1px solid #2b2518;
            border-radius: 8px;
            padding: 10px;
            min-width: 140px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .dropdown-connexion.show {
            display: block;
        }

        .dropdown-connexion a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 12px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .dropdown-connexion a:hover {
            background: #1a1712;
            color: #cca43b;
        }

        .navigation-section {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-back {
            background: #12110e;
            border: 1px solid #2b2518;
            color: #cca43b;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: #cca43b;
            color: #000;
        }

        .search-container {
            flex: 1;
            max-width: 400px;
            min-width: 200px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 8px 12px 8px 35px;
            background: #12110e;
            border: 1px solid #2b2518;
            color: #fff;
            border-radius: 20px;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        .search-container input:focus {
            border-color: #cca43b;
            outline: none;
        }

        .search-container i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        .btn-ajouter-film {
            background: #cca43b;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
        }

        .films-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 0 20px 30px 20px;
        }

        .film-card {
            background: #12110e;
            border: 1px solid #2b2518;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .film-poster-container {
            position: relative;
            width: 100%;
            padding-top: 140%;
            background: #000;
        }

        .film-poster-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .film-info {
            padding: 10px;
        }

        .film-title {
            font-size: 0.95rem;
            margin: 0 0 5px 0;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .film-desc {
            font-size: 0.75rem;
            color: #888;
            margin: 0 0 10px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .download-progress {
            display: none;
            font-size: 0.8rem;
            color: #cca43b;
            text-align: center;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .film-actions {
            display: flex;
            gap: 5px;
        }

        .btn-action {
            flex: 1;
            padding: 6px 0;
            font-size: 0.75rem;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-watch {
            background: #cca43b;
            color: #000;
        }

        .btn-download {
            background: #222;
            color: #fff;
            border: 1px solid #333;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: #12110e;
            border: 1px solid #2b2518;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            margin-top: 0;
            color: #cca43b;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #ccc;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #1a1712;
            border: 1px solid #2b2518;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .upload-progress {
            display: none;
            font-size: 0.85rem;
            color: #cca43b;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-submit {
            background: #cca43b;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-close {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header-checkout">
        <div class="logo-checkout"><span>Store</span></div>
        <div class="menu-icons">
            <i class="fa-regular fa-bell" style="cursor: pointer;"></i>
            <div class="barres-menu" id="btn-menu-burger" style="cursor: pointer;">
                <span></span>
                <span></span>
            </div>
            <div class="dropdown-connexion" id="box-connexion">
                <a href="#" id="link-connexion">
                    <i class="fa-solid fa-right-to-bracket" style="color: #cca43b;"></i> Connexion
                </a>
            </div>
        </div>
    </div>

    <div class="navigation-section">
        <a href="index.html" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Accueil
        </a>
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-movie-input" placeholder="Rechercher un film...">
        </div>
        <button class="btn-ajouter-film" id="open-modal-btn">
            <i class="fa-solid fa-plus"></i> Ajouter
        </button>
    </div>

    <div class="soustitre" style="margin-top: 10px;">
        <h1>MW <span style="color: #D4AF37;">MOVIES</span></h1>
        <p>Regardez et téléchargez vos films préférés gratuitement.</p>
    </div>

    <div class="films-grid" id="container-films"></div>

    <div class="modal" id="modal-film">
        <div class="modal-content">
            <h3>Proposer un Film</h3>
            <form id="form-film">
                <div class="form-group">
                    <label>Nom du film *</label>
                    <input type="text" id="film-name-input" required placeholder="Ex: Naruto Shippuden">
                </div>
                <div class="form-group">
                    <label>Affiche / Image du film *</label>
                    <input type="file" id="film-image-input" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>Sélectionner le fichier vidéo *</label>
                    <input type="file" id="film-video-input" accept="video/*" required>
                </div>
                <div class="form-group">
                    <label>Description (Optionnel)</label>
                    <textarea id="film-desc-input" rows="3" placeholder="Petit résumé..."></textarea>
                </div>
                <div class="upload-progress" id="upload-status">Envoi en cours : 0%</div>
                <div class="modal-buttons">
                    <button type="button" class="btn-close" id="close-modal-btn">Annuler</button>
                    <button type="submit" class="btn-submit" id="submit-film-btn">Envoyer</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>

    <!-- SCRIPT FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <script>
        // --- KONFIGIRASYON FIREBASE PAW LA ---
        const firebaseConfig = {
            apiKey: "AIzaSyCLI1saOnC901wS54bR57Pni6qr5C4PrzM",
            authDomain: "mwstore-526d1.firebaseapp.com",
            projectId: "mwstore-526d1",
            storageBucket: "mwstore-526d1.firebasestorage.app",
            messagingSenderId: "901851187874",
            appId: "1:901851187874:web:a5936637da5cfa925325fb",
            measurementId: "G-5H72KDEHD9"
        };
        
        firebase.initializeApp(firebaseConfig);
        const fbDb = firebase.firestore();
        const fbStorage = firebase.storage();

        // --- CHARGE FILMS YO DEPI NAN FIREBASE ONLINE ---
        function loadMoviesFromFirebase() {
            fbDb.collection("movies").onSnapshot((snapshot) => {
                const container = document.getElementById('container-films');
                container.innerHTML = '';
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    kreyekatFilmHtml(data.name, data.videoUrl, data.imageUrl, data.desc);
                });
            }, (error) => {
                console.error("Erreur chargement Firebase :", error);
            });
        }

        loadMoviesFromFirebase();

        document.getElementById('link-connexion').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.setItem("vini_de", "film-gratis.html");
            window.location.href = "connexion1.html";
        });

        document.getElementById('btn-menu-burger').addEventListener('click', function(e) {
            e.stopPropagation();
            let mounNanKonekte = localStorage.getItem("user_connecte");
            if (mounNanKonekte === "true") {
                window.location.href = "profil.html";
            } else {
                document.getElementById('box-connexion').classList.toggle('show');
            }
        });

        document.addEventListener('click', function() {
            document.getElementById('box-connexion').classList.remove('show');
        });

        const modal = document.getElementById('modal-film');
        document.getElementById('open-modal-btn').addEventListener('click', () => modal.style.display = 'flex');
        document.getElementById('close-modal-btn').addEventListener('click', () => modal.style.display = 'none');

        function kreyekatFilmHtml(name, videoUrl, imageUrl, desc) {
            const nouvoFilm = document.createElement('div');
            nouvoFilm.className = 'film-card';
            nouvoFilm.setAttribute('data-name', name.toLowerCase());
            nouvoFilm.innerHTML = `
                <div class="film-poster-container">
                    <img src="${imageUrl || 'https://via.placeholder.com/160x224?text=Pas+d\'image'}" alt="${name}">
                </div>
                <div class="film-info">
                    <h3 class="film-title">${name}</h3>
                    <p class="film-desc">${desc}</p>
                    <div class="download-progress">Téléchargement : 0%</div>
                    <div class="film-actions">
                        <a href="${videoUrl}" target="_blank" class="btn-action btn-watch">Regarder</a>
                        <button class="btn-action btn-download" onclick="realDownload(this, '${videoUrl}', '${name}')">Télécharger</button>
                    </div>
                </div>
            `;
            document.getElementById('container-films').appendChild(nouvoFilm);
        }


        document.getElementById('search-movie-input').addEventListener('input', function(e) {
            const searchText = e.target.value.toLowerCase().trim();
            const cards = document.querySelectorAll('.film-card');

            cards.forEach(card => {
                const filmName = card.getAttribute('data-name');
                if (filmName.includes(searchText)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        });

        // --- ENVOI FIREBASE (STORAGE + FIRESTORE) ---
        document.getElementById('form-film').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('film-name-input').value;
            const imageFile = document.getElementById('film-image-input').files[0];
            const videoFile = document.getElementById('film-video-input').files[0];
            const desc = document.getElementById('film-desc-input').value || "Aucune description disponible.";

            if (!videoFile || !imageFile) return;

            const uploadStatus = document.getElementById('upload-status');
            const submitBtn = document.getElementById('submit-film-btn');
            
            uploadStatus.style.display = 'block';
            submitBtn.disabled = true;

            const timestamp = Date.now();
            const imageRef = fbStorage.ref().child(`images/${timestamp}_${imageFile.name}`);
            const videoRef = fbStorage.ref().child(`videos/${timestamp}_${videoFile.name}`);

            uploadStatus.innerText = "Téléchargement de l'affiche...";
            imageRef.put(imageFile).then(() => {
                return imageRef.getDownloadURL();
            }).then((imageUrl) => {
                

                const videoUploadTask = videoRef.put(videoFile);
                
                videoUploadTask.on('state_changed', 
                    (snapshot) => {
                        const percent = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                        uploadStatus.innerText = `Envoi de la vidéo : ${percent}% (${Math.round(snapshot.bytesTransferred/1024)} KB / ${Math.round(snapshot.totalBytes/1024)} KB)`;
                    }, 
                    (error) => {
                        console.error(error);
                        uploadStatus.innerText = "Erreur gjat envoi.";
                        submitBtn.disabled = false;
                    }, 
                    () => {

                        videoUploadTask.snapshot.ref.getDownloadURL().then((videoUrl) => {
                            

                            return fbDb.collection("movies").add({
                                name: name,
                                imageUrl: imageUrl,
                                videoUrl: videoUrl,
                                desc: desc,
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }).then(() => {
                            // Reset fòm nan ak modal la
                            uploadStatus.style.display = 'none';
                            submitBtn.disabled = false;
                            document.getElementById('form-film').reset();
                            modal.style.display = 'none';
                        });
                    }
                );
            }).catch(err => {
                console.error(err);
                uploadStatus.innerText = "Erreur lors de l'envoi.";
                submitBtn.disabled = false;
            });
        });

        // --- TELECHAJMAN SENKRONIZE AK VITÈS REYÈL REZO A ---
        function realDownload(btn, videoUrl, filename) {
            const cardInfo = btn.closest('.film-info');
            const progressDiv = cardInfo.querySelector('.download-progress');
            
            btn.disabled = true;
            progressDiv.style.display = 'block';
            
            fetch(videoUrl)
                .then(response => {
                    const reader = response.body.getReader();
                    const contentLength = response.headers.get('Content-Length') || 50000000;
                    let receivedLength = 0;
                    let chunks = [];

                    function read() {
                        return reader.read().then(({ done, value }) => {
                            if (done) {
                                return chunks;
                            }
                            chunks.push(value);
                            receivedLength += value.length;
                            
                            const percent = Math.round((receivedLength / contentLength) * 100);
                            const finalPercent = percent > 100 ? 100 : percent;
                            progressDiv.innerText = `Téléchargement : ${finalPercent}% (${Math.round(receivedLength/1024)} KB)`;
                            
                            return read();
                        });
                    }
                    return read();
                })
                .then(chunks => {
                    progressDiv.innerText = `Téléchargement terminé !`;
                    
                    const blob = new Blob(chunks);
                    const downloadUrl = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = `${filename}.mp4`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    
                    setTimeout(() => {
                        progressDiv.style.display = 'none';
                        progressDiv.innerText = `Téléchargement : 0%`;
                        btn.disabled = false;
                    }, 2000);
                })
                .catch(err => {
                    console.error(err);
                    progressDiv.style.display = 'none';
                    btn.disabled = false;
                });
        }
    </script>
</body>
</html>
