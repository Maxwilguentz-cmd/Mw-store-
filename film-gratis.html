<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWStore - Films Gratuits</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #0c0b09;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .menu-icons {
            position: relative;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .dropdown-connexion {
            display: none;
            position: absolute;
            top: 40px;
            right: 0;
            background: #0c0b09;
            border: 1px solid #2b2518;
            border-radius: 8px;
            padding: 10px;
            min-width: 140px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .dropdown-connexion.show {
            display: block;
        }

        .dropdown-connexion a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 12px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .dropdown-connexion a:hover {
            background: #1a1712;
            color: #cca43b;
        }

        .navigation-section {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-back {
            background: #12110e;
            border: 1px solid #2b2518;
            color: #cca43b;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: #cca43b;
            color: #000;
        }

        .btn-ajouter-film {
            background: #cca43b;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
        }

        .films-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 0 20px 30px 20px;
        }

        .film-card {
            background: #12110e;
            border: 1px solid #2b2518;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .film-video-container {
            position: relative;
            width: 100%;
            padding-top: 140%;
            background: #000;
        }

        .film-video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .film-info {
            padding: 10px;
        }

        .film-title {
            font-size: 0.95rem;
            margin: 0 0 5px 0;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .film-desc {
            font-size: 0.75rem;
            color: #888;
            margin: 0 0 10px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .download-progress {
            display: none;
            font-size: 0.8rem;
            color: #cca43b;
            text-align: center;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .film-actions {
            display: flex;
            gap: 5px;
        }

        .btn-action {
            flex: 1;
            padding: 6px 0;
            font-size: 0.75rem;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-watch {
            background: #cca43b;
            color: #000;
        }

        .btn-download {
            background: #222;
            color: #fff;
            border: 1px solid #333;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: #12110e;
            border: 1px solid #2b2518;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
        }

        .modal-content h3 {
            margin-top: 0;
            color: #cca43b;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #ccc;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #1a1712;
            border: 1px solid #2b2518;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .upload-progress {
            display: none;
            font-size: 0.85rem;
            color: #cca43b;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-submit {
            background: #cca43b;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-close {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header-checkout">
        <div class="logo-checkout"><span>Store</span></div>
        <div class="menu-icons">
            <i class="fa-regular fa-bell" style="cursor: pointer;"></i>
            <div class="barres-menu" id="btn-menu-burger" style="cursor: pointer;">
                <span></span>
                <span></span>
            </div>
            <div class="dropdown-connexion" id="box-connexion">
                <a href="#" id="link-connexion">
                    <i class="fa-solid fa-right-to-bracket" style="color: #cca43b;"></i> Connexion
                </a>
            </div>
        </div>
    </div>

    <div class="navigation-section">
        <a href="index.html" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Accueil
        </a>
        <button class="btn-ajouter-film" id="open-modal-btn">
            <i class="fa-solid fa-plus"></i> Ajouter
        </button>
    </div>

    <div class="soustitre" style="margin-top: 10px;">
        <h1>MW <span style="color: #D4AF37;">MOVIES</span></h1>
        <p>Regardez et téléchargez vos films préférés gratuitement.</p>
    </div>

    <div class="films-grid" id="container-films"></div>

    <div class="modal" id="modal-film">
        <div class="modal-content">
            <h3>Proposer un Film</h3>
            <form id="form-film">
                <div class="form-group">
                    <label>Nom du film *</label>
                    <input type="text" id="film-name-input" required placeholder="Ex: Naruto Shippuden">
                </div>
                <div class="form-group">
                    <label>Sélectionner le fichier vidéo *</label>
                    <input type="file" id="film-video-input" accept="video/*" required>
                </div>
                <div class="form-group">
                    <label>Description (Optionnel)</label>
                    <textarea id="film-desc-input" rows="3" placeholder="Petit résumé..."></textarea>
                </div>
                <div class="upload-progress" id="upload-status">Envoi en cours : 0%</div>
                <div class="modal-buttons">
                    <button type="button" class="btn-close" id="close-modal-btn">Annuler</button>
                    <button type="submit" class="btn-submit" id="submit-film-btn">Envoyer</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>

    <script>
        let db;
        const request = indexedDB.open("MWStoreMoviesDB", 1);

        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("movies")) {
                db.createObjectStore("movies", { keyPath: "id", autoIncrement: true });
            }
        };

        request.onsuccess = function(e) {
            db = e.target.result;
            loadMoviesFromDB(); // Chaje tout fim yo depi nan baz done a lè paj la louvri
        };

        request.onerror = function(e) {
            console.error("Erreur IndexedDB :", e.target.error);
        };

        document.getElementById('link-connexion').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.setItem("vini_de", "film-gratis.html");
            window.location.href = "connexion1.html";
        });

        document.getElementById('btn-menu-burger').addEventListener('click', function(e) {
            e.stopPropagation();
            let mounNanKonekte = localStorage.getItem("user_connecte");
            if (mounNanKonekte === "true") {
                window.location.href = "profil.html";
            } else {
                document.getElementById('box-connexion').classList.toggle('show');
            }
        });

        document.addEventListener('click', function() {
            document.getElementById('box-connexion').classList.remove('show');
        });

        const modal = document.getElementById('modal-film');
        document.getElementById('open-modal-btn').addEventListener('click', () => modal.style.display = 'flex');
        document.getElementById('close-modal-btn').addEventListener('click', () => modal.style.display = 'none');

        function kreyekatFilmHtml(name, videoUrl, desc) {
            const nouvoFilm = document.createElement('div');
            nouvoFilm.className = 'film-card';
            nouvoFilm.innerHTML = `
                <div class="film-video-container">
                    <video src="${videoUrl}" preload="metadata" muted loop playsinline></video>
                </div>
                <div class="film-info">
                    <h3 class="film-title">${name}</h3>
                    <p class="film-desc">${desc}</p>
                    <div class="download-progress">Téléchargement : 0%</div>
                    <div class="film-actions">
                        <a href="${videoUrl}" target="_blank" class="btn-action btn-watch">Regarder</a>
                        <button class="btn-action btn-download" onclick="realDownload(this, '${videoUrl}', '${name}')">Télécharger</button>
                    </div>
                </div>
            `;
            document.getElementById('container-films').appendChild(nouvoFilm);
        }

        // --- CHAJE FILMYO NAN DATA EPY METE YO NAN PAJ LA ---
        function loadMoviesFromDB() {
            const transaction = db.transaction(["movies"], "readonly");
            const store = transaction.objectStore("movies");
            const cursorRequest = store.openCursor();

            document.getElementById('container-films').innerHTML = ''; // Netwaye espas la anvan

            cursorRequest.onsuccess = function(e) {
                const cursor = e.target.result;
                if (cursor) {
                    const videoUrl = URL.createObjectURL(cursor.value.videoBlob);
                    kreyekatFilmHtml(cursor.value.name, videoUrl, cursor.value.desc);
                    cursor.continue(); // Al chache pwochen fim nan nan data a jiskaske yo fini
                }
            };
        }

        // --- ENVOI SENKRONIZE NÈT AK KB/BYTES K AP MOUNTE YO (VITÈS REYÈL) ---
        document.getElementById('form-film').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('film-name-input').value;
            const videoFile = document.getElementById('film-video-input').files[0];
            const desc = document.getElementById('film-desc-input').value || "Aucune description disponible.";

            if (!videoFile) return;

            const uploadStatus = document.getElementById('upload-status');
            const submitBtn = document.getElementById('submit-film-btn');
            
            uploadStatus.style.display = 'block';
            submitBtn.disabled = true;

            const reader = new FileReader();

            // Pousantaj sa ap avanse byte pa byte selon vitès sistèm lan ap li KB yo
            reader.onprogress = function(event) {
                if (event.lengthComputable) {
                    const percent = Math.round((event.loaded / event.total) * 100);
                    uploadStatus.innerText = `Envoi en cours : ${percent}% (${Math.round(event.loaded/1024)} KB / ${Math.round(event.total/1024)} KB)`;
                }
            };

            reader.onloadend = function() {
                const transaction = db.transaction(["movies"], "readwrite");
                const store = transaction.objectStore("movies");
                
                const movieData = {
                    name: name,
                    videoBlob: videoFile, // Fichye a sove anndan data a la
                    desc: desc
                };

                store.add(movieData);

                transaction.oncomplete = function() {
                    loadMoviesFromDB(); // Al chache nouvo fim nan nan data a pou mete l nan paj la otomatikman
                    uploadStatus.style.display = 'none';
                    uploadStatus.innerText = `Envoi en cours : 0%`;
                    submitBtn.disabled = false;
                    document.getElementById('form-film').reset();
                    modal.style.display = 'none';
                };
            };

            reader.readAsArrayBuffer(videoFile);
        });

        // --- TELECHAJMAN SENKRONIZE AK VITÈS REYÈL REZO A (KB PA KB) ---
        function realDownload(btn, videoUrl, filename) {
            const cardInfo = btn.closest('.film-info');
            const progressDiv = cardInfo.querySelector('.download-progress');
            
            btn.disabled = true;
            progressDiv.style.display = 'block';
            
            fetch(videoUrl)
                .then(response => {
                    const reader = response.body.getReader();
                    // Jwenn vrè gwosè videyo a an Bytes dirèkteman
                    const contentLength = response.headers.get('Content-Length') || 50000000;
                    let receivedLength = 0;
                    let chunks = [];

                    function read() {
                        return reader.read().then(({ done, value }) => {
                            if (done) {
                                return chunks;
                            }
                            chunks.push(value);
                            receivedLength += value.length;
                            
                            // Kalkile pousantaj reyèl la byte pa byte selon vitès telechajman an
                            const percent = Math.round((receivedLength / contentLength) * 100);
                            const finalPercent = percent > 100 ? 100 : percent;
                            progressDiv.innerText = `Téléchargement : ${finalPercent}% (${Math.round(receivedLength/1024)} KB)`;
                            
                            return read();
                        });
                    }
                    return read();
                })
                .then(chunks => {
                    progressDiv.innerText = `Téléchargement terminé !`;
                    
                    const blob = new Blob(chunks);
                    const downloadUrl = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = `${filename}.mp4`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    
                    setTimeout(() => {
                        progressDiv.style.display = 'none';
                        progressDiv.innerText = `Téléchargement : 0%`;
                        btn.disabled = false;
                    }, 2000);
                })
                .catch(err => {
                    console.error(err);
                    progressDiv.style.display = 'none';
                    btn.disabled = false;
                });
        }
    </script>
</body>
</html>
