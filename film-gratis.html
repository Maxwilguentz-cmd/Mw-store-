<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWStore - Films Gratuits</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* CSS espesyal pou paj fim nan ka parèt byen sou telefòn */
        body {
            background-color: #0c0b09;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .menu-icons {
            position: relative;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .dropdown-connexion {
            display: none;
            position: absolute;
            top: 40px;
            right: 0;
            background: #0c0b09;
            border: 1px solid #2b2518;
            border-radius: 8px;
            padding: 10px;
            min-width: 140px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .dropdown-connexion.show {
            display: block;
        }

        .dropdown-connexion a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 12px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .dropdown-connexion a:hover {
            background: #1a1712;
            color: #cca43b;
        }

        /* Bouton Retounen style Netflix */
        .navigation-section {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-back {
            background: #12110e;
            border: 1px solid #2b2518;
            color: #cca43b;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: #cca43b;
            color: #000;
        }

        /* Bouton "Ajouter un film" */
        .btn-ajouter-film {
            background: #cca43b;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
        }

        /* Grid pou afiche fim yo (Responsive pou telefòn) */
        .films-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 0 20px 30px 20px;
        }

        .film-card {
            background: #12110e;
            border: 1px solid #2b2518;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .film-video-container {
            position: relative;
            width: 100%;
            padding-top: 140%; /* Kenbe fòma afich tradisyonèl la */
            background: #000;
        }

        .film-video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .film-info {
            padding: 10px;
        }

        .film-title {
            font-size: 0.95rem;
            margin: 0 0 5px 0;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .film-desc {
            font-size: 0.75rem;
            color: #888;
            margin: 0 0 10px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .film-actions {
            display: flex;
            gap: 5px;
        }

        .btn-action {
            flex: 1;
            padding: 6px 0;
            font-size: 0.75rem;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-watch {
            background: #cca43b;
            color: #000;
        }

        .btn-download {
            background: #222;
            color: #fff;
            border: 1px solid #333;
        }

        /* Modal pou fòm ajoute fim lan */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: #12110e;
            border: 1px solid #2b2518;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
        }

        .modal-content h3 {
            margin-top: 0;
            color: #cca43b;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #ccc;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #1a1712;
            border: 1px solid #2b2518;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-submit {
            background: #cca43b;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-close {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Menm Header a ak res sit la -->
    <div class="header-checkout">
        <div class="logo-checkout"><span>Store</span></div>
        <div class="menu-icons">
            <i class="fa-regular fa-bell" style="cursor: pointer;"></i>
            
            <div class="barres-menu" id="btn-menu-burger" style="cursor: pointer;">
                <span></span>
                <span></span>
            </div>

            <div class="dropdown-connexion" id="box-connexion">
                <a href="#" id="link-connexion">
                    <i class="fa-solid fa-right-to-bracket" style="color: #cca43b;"></i> Connexion
                </a>
            </div>
        </div>
    </div>

    <!-- Seksyon Navigasyon -->
    <div class="navigation-section">
        <a href="index.html" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Accueil
        </a>
        
        <button class="btn-ajouter-film" id="open-modal-btn">
            <i class="fa-solid fa-plus"></i> Ajouter
        </button>
    </div>

    <div class="soustitre" style="margin-top: 10px;">
        <h1>MW <span style="color: #D4AF37;">MOVIES</span></h1>
        <p>Regardez et téléchargez vos films préférés gratuitement.</p>
    </div>

    <!-- Grid kote tout fim yo ap afiche -->
    <div class="films-grid" id="container-films">
        <!-- Kat sa ap rete vid pou nouvo fim yo ka antre otomatikman ak videyo pa yo -->
    </div>

    <!-- Modal pou fòm pou ajoute fim nan (Popup) -->
    <div class="modal" id="modal-film">
        <div class="modal-content">
            <h3>Proposer un Film</h3>
            <form id="form-film">
                <div class="form-group">
                    <label>Nom du film *</label>
                    <input type="text" id="film-name-input" required placeholder="Ex: Naruto Shippuden">
                </div>
                <div class="form-group">
                    <label>Sélectionner le fichier vidéo *</label>
                    <!-- Nou chanje sa pou n mande yon fichye videyo dirèkteman -->
                    <input type="file" id="film-video-input" accept="video/*" required>
                </div>
                <div class="form-group">
                    <label>Description (Optionnel)</label>
                    <textarea id="film-desc-input" rows="3" placeholder="Petit résumé..."></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-close" id="close-modal-btn">Annuler</button>
                    <button type="submit" class="btn-submit">Envoyer</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>

    <script>
        // --- 1. KONTWÒL PAJ CONNEXION AK REDIREKSYON ---
        document.getElementById('link-connexion').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.setItem("vini_de", "film-gratis.html");
            window.location.href = "connexion1.html";
        });

        // --- 2. LOGIK DE BAR DEPO PI WO A ---
        document.getElementById('btn-menu-burger').addEventListener('click', function(e) {
            e.stopPropagation();
            let mounNanKonekte = localStorage.getItem("user_connecte");

            if (mounNanKonekte === "true") {
                window.location.href = "profil.html";
            } else {
                document.getElementById('box-connexion').classList.toggle('show');
            }
        });

        document.addEventListener('click', function() {
            document.getElementById('box-connexion').classList.remove('show');
        });

        // --- 3. LOGIK MODAL (POPUP AJOUTER FILM) ---
        const modal = document.getElementById('modal-film');
        document.getElementById('open-modal-btn').addEventListener('click', () => modal.style.display = 'flex');
        document.getElementById('close-modal-btn').addEventListener('click', () => modal.style.display = 'none');

        // --- 4. LOGIK POU AJOUTE VIDESYO A AK TOUT DETAY LI ---
        document.getElementById('form-film').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('film-name-input').value;
            const videoFile = document.getElementById('film-video-input').files[0];
            const desc = document.getElementById('film-desc-input').value || "Aucune description disponible.";

            if (!videoFile) return;

            // Kòd sa a transfòme fichye videyo lokal la an yon lyen (URL) k ap ka jwe nan navigatè a
            const videoUrl = URL.createObjectURL(videoFile);

            // Kreye kat la ak yon eleman <video> ki gen kontwòl olye de yon senp foto
            const nouvoFilm = document.createElement('div');
            nouvoFilm.className = 'film-card';
            nouvoFilm.innerHTML = `
                <div class="film-video-container">
                    <video src="${videoUrl}" preload="metadata" muted loop playsinline></video>
                </div>
                <div class="film-info">
                    <h3 class="film-title">${name}</h3>
                    <p class="film-desc">${desc}</p>
                    <div class="film-actions">
                        <a href="${videoUrl}" target="_blank" class="btn-action btn-watch">Regarder</a>
                        <a href="${videoUrl}" download="${name}.mp4" class="btn-action btn-download">Télécharger</a>
                    </div>
                </div>
            `;

            // Ajoute fim nan nan grid la
            document.getElementById('container-films').appendChild(nouvoFilm);

            // Netwaye fòm nan epi kache modal la
            document.getElementById('form-film').reset();
            modal.style.display = 'none';
        });
    </script>
</body>
</html>
